@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<script>
(()=>{
const $=id=>document.getElementById(id),mq=matchMedia('(prefers-reduced-motion: reduce)'),rm=()=>mq.matches;
const TAU=Math.PI*2,ease=q=>1-Math.pow(1-Math.min(1,Math.max(0,q)),3);
const bg=$('bg'),bc=bg.getContext('2d'),fxc=$('fx'),fx=fxc.getContext('2d'),light=$('light'),stage=$('stage'),blobs=$('blobs');
let W=0,H=0,D=1,ps=[],items=[],dirty=false,last=[-1,-1];

const col=(o,a,l=82)=>`hsla(${o.h},85%,${l}%,${Math.max(0,Math.min(1,a))})`;
const ring=(c,x,y,r,o,a,w)=>{c.beginPath();c.arc(x,y,Math.max(.1,r),0,TAU);c.lineWidth=w;c.strokeStyle=col(o,a);c.stroke()};
const dot=(c,x,y,r,o,a)=>{c.beginPath();c.arc(x,y,Math.max(.1,r),0,TAU);c.fillStyle=col(o,a);c.fill()};
const rings=(c,x,y,p,o,k,m,w,al)=>{for(let i=0;i<k;i++){const q=(p-i*.13)/(1-i*.13);if(q>0)ring(c,x,y,o.s*m*ease(q),o,(1-q)*al,w*(1-q)+.6)}};
const poly=(c,x,y,r,n,rot,o,a,w,inner)=>{c.beginPath();const m=inner?n*2:n;for(let i=0;i<m;i++){const rr=inner&&i%2?r*inner:r,t=rot+i*TAU/m;c[i?'lineTo':'moveTo'](x+Math.cos(t)*rr,y+Math.sin(t)*rr)}c.closePath();c.lineWidth=w;c.strokeStyle=col(o,a);c.stroke()};
const shape=(n,rot)=>(c,x,y,p,o,k=1)=>{for(let i=0;i<k;i++){const q=(p-i*.15)/(1-i*.15);if(q>0)poly(c,x,y,o.s*ease(q),n,rot,o,1-q,2.5*(1-q)+.5,0)}};
const grad=(c,x,y,r,stops)=>{const g=c.createRadialGradient(x,y,0,x,y,r);stops.forEach((s,i)=>g.addColorStop(i,s));c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2)};

const T={
R:(c,x,y,p,o,k=1)=>rings(c,x,y,p,o,k,1,3,1),
SW:(c,x,y,p,o,k=1)=>rings(c,x,y,p,o,k,1.3,12,.7),
CH:(c,x,y,p,o)=>{[-60,0,60].forEach((d,i)=>{const q=Math.max(0,p-i*.06);ring(c,x,y,o.s*ease(q),{h:o.h+d},1-q,2.5*(1-q)+.5)})},
P:(c,x,y,p,o,k=1)=>{const n=8+k*6,e=ease(p);for(let j=0;j<n;j++){const a=o.r[j]*TAU,d=o.s*(.4+o.r[j+30]*.8)*e;dot(c,x+Math.cos(a)*d,y+Math.sin(a)*d,2.8*(1-p)+.5,o,1-p)}},
SK:(c,x,y,p,o,k=1)=>{const n=6+k*4,e=ease(p);c.lineWidth=1.6;c.strokeStyle=col(o,1-p,92);c.beginPath();for(let j=0;j<n;j++){const a=o.r[j]*TAU,d0=o.s*(.25+o.r[j+20]*.35)*e,d1=d0+o.s*.28*(1-p);c.moveTo(x+Math.cos(a)*d0,y+Math.sin(a)*d0);c.lineTo(x+Math.cos(a)*d1,y+Math.sin(a)*d1)}c.stroke()},
RY:(c,x,y,p,o)=>{const e=ease(p);c.lineWidth=2;c.strokeStyle=col(o,1-p,90);c.beginPath();for(let j=0;j<16;j++){const a=o.rot+j*TAU/16,d0=o.s*.15+o.s*.2*e,d1=d0+o.s*(j%2?.35:.6)*e;c.moveTo(x+Math.cos(a)*d0,y+Math.sin(a)*d0);c.lineTo(x+Math.cos(a)*d1,y+Math.sin(a)*d1)}c.stroke()},
ST:(c,x,y,p,o)=>{const e=ease(p);poly(c,x,y,o.s*.9*e,5,o.rot,o,1-p,2,.45);poly(c,x,y,o.s*.6*e,5,o.rot+.6,o,(1-p)*.6,1.4,.45)},
B:(c,x,y,p,o,k=1)=>{const n=5+k*4,e=ease(p);for(let j=0;j<n;j++){const bx=x+(o.r[j]-.5)*o.s*1.6*e,by=y+(o.r[j+20]-.6)*o.s*1.2*e-o.s*.5*p*p,r=3+o.r[j+40]*7;ring(c,bx,by,r,o,1-p,1.2)}},
F:(c,x,y,p,o)=>grad(c,x,y,o.s*.9,[`rgba(255,255,255,${Math.pow(1-p,2)})`,'rgba(255,255,255,0)']),
W:(c,x,y,p,o)=>grad(c,x,y,o.s*ease(p)+1,[col(o,.5*(1-p)),col(o,0)]),
O:(c,x,y,p,o,k=1)=>{const n=5+k,d=o.s*.55*(.6+.4*ease(p));for(let i=0;i<n;i++){const a=o.rot+p*7+i*TAU/n;dot(c,x+Math.cos(a)*d,y+Math.sin(a)*d,3.2*(1-p)+.6,o,1-p)}},
D:shape(4,Math.PI/4),Q:shape(4,0),H:shape(6,0),
SP:(c,x,y,p,o,k=1)=>{const e=ease(p);for(let a=0;a<k;a++)for(let j=0;j<22;j++){const t=j/22,ang=t*9+p*4+a*TAU/k,d=o.s*t*e;dot(c,x+Math.cos(ang)*d,y+Math.sin(ang)*d,2.4*(1-p)*(.4+t)+.4,o,(1-p)*(.4+t*.6))}},
VX:(c,x,y,p,o,k=1)=>{const e=ease(p*1.4);for(let a=0;a<k;a++)for(let j=0;j<22;j++){const t=j/22,ang=-t*12+p*9+a*TAU/k,d=o.s*.8*t*(1-p*.4)*e;dot(c,x+Math.cos(ang)*d,y+Math.sin(ang)*d,2.6*(1-p)+.4,o,(1-p)*(.3+t*.7))}},
C:(c,x,y,p,o)=>{const e=ease(p);c.lineWidth=2.5*(1-p)+.6;c.strokeStyle=col(o,1-p,90);c.beginPath();for(let j=0;j<5;j++){const a=o.r[j]*TAU,d=o.s*e,cs=Math.cos(a),sn=Math.sin(a);c.moveTo(x+cs*d*.55,y+sn*d*.55);c.lineTo(x+cs*d,y+sn*d)}c.stroke()},
LF:(c,x,y,p,o)=>{T.F(c,x,y,p,o);const w=o.s*1.4*ease(p),g=c.createLinearGradient(x-w,0,x+w,0);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,`rgba(255,255,255,${1-p})`);g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(x-w,y-1.5,w*2,3)},
CR:(c,x,y,p,o)=>{const e=ease(p);c.lineWidth=1.3;c.strokeStyle=col(o,1-p,92);c.beginPath();for(let i=0;i<6;i++){let a=o.r[i]*TAU,px=x,py=y;c.moveTo(px,py);for(let s=0;s<3;s++){a+=(o.r[i+6+s]-.5)*.9;const L=o.s*.33*e;px+=Math.cos(a)*L;py+=Math.sin(a)*L;c.lineTo(px,py)}}c.stroke()},
DR:(c,x,y,p,o,k=1)=>{const n=8+k*5,e=ease(p);for(let j=0;j<n;j++){const vx=(o.r[j]-.5)*o.s*(1.8-.4*k),vy=o.s*(.5+o.r[j+30]*.5)*(.6+.4*k);dot(c,x+vx*e,y-vy*e+o.s*.9*p*p,3*(1-p)+.8,o,1-p*.8)}},
CW:(c,x,y,p,o)=>{const d=o.s*ease(p);for(let j=0;j<24;j++){const a=j*TAU/24+o.rot;dot(c,x+Math.cos(a)*d,y+Math.sin(a)*d,2.2*(1-p)+.6,o,1-p)}},
LB:(c,x,y,p,o)=>{const h=o.s*1.5*ease(p);c.fillStyle=col(o,.8*(1-p),92);c.fillRect(x-2*(1-p)-.5,y-h,4*(1-p)+1,h*2);c.fillRect(x-h,y-.5,h*2,1+2*(1-p))},
GR:(c,x,y,p,o)=>{c.save();c.translate(x,y);c.rotate(-.7);c.fillStyle=col(o,.25*(1-p),95);c.fillRect((p*2-1)*o.s-10,-o.s*1.4,20,o.s*2.8);c.restore()},
EL:(c,x,y,p,o,k=1)=>{const e=ease(p),a=1-p,s=o.s;const el=(px,py,rx,ry)=>{c.beginPath();c.ellipse(px,py,Math.max(.1,rx),Math.max(.1,ry),0,0,TAU);c.lineWidth=2.5*a+.5;c.strokeStyle=col(o,a);c.stroke()};if(k===1)el(x,y,s*1.3*e,s*.3*e);else if(k===2)el(x,y,s*.3*e,s*1.3*e);else if(k===3){el(x,y,s*1.3*e,s*.3*e);el(x,y,s*.3*e,s*1.3*e)}else[[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>el(x+d[0]*s*.5*e,y+d[1]*s*.5*e,s*.35*e,s*.35*e))},
PB:(c,x,y,p,o)=>{dot(c,x,y,o.s*.1*(1-p*.7),o,(1-p)*.9);T.R(c,x,y,p,o,3);T.DR(c,x,y,p,o,1)}
};

const GL=['R','R2','SW','SW2','R3','P','ST','B','F','RY','R P','SK','O','R2 F','D','H','Q','CH','R P2','SK2','P3','B2','SP','C','SP2','LF','CR','DR','DR2','R DR','R F','R B','SW SK','RY P','ST R','O F','R2 P','R3 SK','Q D','D2','CH P','W','DR3','CW','SP W','B3 R','LB','GR','CW O','MIX'];
const WL=['PB','R2','R3','DR2','DR','B','R B','R DR','SW','R','VX','VX2','GR','W R','DR3','SW R','B2 R','R2 B','D','Q','H','EL1','EL2','EL3','EL4','R F','DR F','B3','B2','R3 DR','PB B','PB DR3','R2 P','R P','ST R','ST DR','CH','CH R','CH DR','W B','LB R','SP R','SP2 B','CW','CW DR','SW DR2','VX DR','VX B','P B','MIX'];
const POOL=['R2','SW','P','SK','B','F','RY','O','D','H','Q','SP','C','DR','ST','CH','W','CW','LB','GR'];
const HUES=[205,215,265,280,190,320];

function spawn(x,y,water,el){
  if(items.length>14)return;
  const list=water?WL:GL,w=+water;let i;
  do{i=Math.random()*50|0}while(i===last[w]);
  last[w]=i;
  let t=rm()?['R']:list[i].split(' ');
  if(t[0]==='MIX')t=[0,1,2].map(()=>POOL[Math.random()*POOL.length|0]);
  const r=water?el.getBoundingClientRect():null;
  const o={s:water?Math.max(r.width,r.height)*.7:(70+Math.random()*90)*(W<500?.85:1),h:water?190+Math.random()*30:HUES[Math.random()*HUES.length|0],rot:Math.random()*TAU,r:Array.from({length:64},Math.random)};
  items.push({t0:performance.now(),dur:rm()?450:Math.min(1400,480+t.length*230+Math.random()*300),x,y,el:water?el:null,o,f:t.map(s=>{const m=/^([A-Z]+)(\d*)$/.exec(s);return[T[m[1]],+m[2]||1]})});
  dirty=true;
}

function drawFx(now){
  fx.clearRect(0,0,W,H);
  for(let i=items.length-1;i>=0;i--){
    const it=items[i],p=Math.max(0,(now-it.t0)/it.dur);
    if(p>=1){items.splice(i,1);continue}
    fx.save();
    if(it.el){const r=it.el.getBoundingClientRect();fx.beginPath();if(fx.roundRect)fx.roundRect(r.left,r.top,r.width,r.height,18);else fx.rect(r.left,r.top,r.width,r.height);fx.clip()}
    fx.globalCompositeOperation='lighter';
    it.f.forEach(f=>f[0](fx,it.x,it.y,p,it.o,f[1]));
    fx.restore();
  }
}

function size(init){
  D=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  [bg,fxc].forEach(c=>{c.width=Math.round(W*D);c.height=Math.round(H*D)});
  bc.setTransform(D,0,0,D,0,0);fx.setTransform(D,0,0,D,0,0);
  if(init){const n=Math.min(70,W*H/16000|0);ps=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*8,vy:-4-Math.random()*10,r:.6+Math.random()*1.4,ph:Math.random()*6}))}
}

function drawBg(now,dt){
  bc.clearRect(0,0,W,H);bc.fillStyle='#fff';
  const still=rm();
  for(const p of ps){
    if(!still){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y<-5)p.y=H+5;if(p.x<-5)p.x=W+5;if(p.x>W+5)p.x=-5}
    bc.globalAlpha=still?.3:.15+.3*(.5+.5*Math.sin(now/1200+p.ph));
    bc.beginPath();bc.arc(p.x,p.y,p.r,0,TAU);bc.fill();
  }
  bc.globalAlpha=1;
}

let tx=.5,ty=.5,cx=.5,cy=.5,prev=0;
function frame(now){
  const dt=Math.min((now-prev)/1000||.016,.05);prev=now;
  const k=Math.min(1,dt*6);cx+=(tx-cx)*k;cy+=(ty-cy)*k;
  light.style.transform=`translate3d(${cx*W-200}px,${cy*H-200}px,0)`;
  if(!rm()){
    stage.style.transform=`perspective(900px) rotateX(${(.5-cy)*5}deg) rotateY(${(cx-.5)*7}deg)`;
    blobs.style.transform=`translate3d(${(cx-.5)*-30}px,${(cy-.5)*-30}px,0)`;
  }
  drawBg(now,dt);
  if(items.length||dirty){drawFx(now);dirty=items.length>0}
  requestAnimationFrame(frame);
}

let lt=-1;
function textFx(b){
  const l=b.querySelector('.lbl');let n;
  do{n=Math.random()*16|0}while(n===lt);
  lt=rm()?0:n;
  clearTimeout(l._t);l.style.animation='none';void l.offsetWidth;
  l.style.animation=`a${lt} ${rm()?.4:.95}s ease-in-out`;
  l._t=setTimeout(()=>{l.style.animation=''},1050);
}

document.querySelectorAll('.btn').forEach(b=>{
  b.addEventListener('click',e=>{
    const r=b.getBoundingClientRect(),x=e.clientX||r.left+r.width/2,y=e.clientY||r.top+r.height/2;
    spawn(x,y,true,b);textFx(b);
    if(e.button===0&&!e.ctrlKey&&!e.metaKey&&!e.shiftKey){
      e.preventDefault();
      setTimeout(()=>{const w=window.open(b.href,'_blank');if(w)w.opener=null;else location.href=b.href},rm()?0:450);
    }
  });
  b.addEventListener('pointermove',e=>{
    if(e.pointerType!=='mouse')return;
    const r=b.getBoundingClientRect(),px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
    b.style.setProperty('--px',px*100+'%');b.style.setProperty('--py',py*100+'%');
    if(!rm())b.style.transform=`translate3d(${(px-.5)*8}px,${(py-.5)*6}px,0) rotateX(${(.5-py)*8}deg) rotateY(${(px-.5)*10}deg)`;
  });
  b.addEventListener('pointerleave',()=>{b.style.transform=''});
});

addEventListener('pointerdown',e=>{
  tx=e.clientX/W;ty=e.clientY/H;
  if(e.target.closest&&e.target.closest('.btn'))return;
  spawn(e.clientX,e.clientY,false);
},{passive:true});
addEventListener('pointermove',e=>{tx=e.clientX/W;ty=e.clientY/H},{passive:true});
addEventListener('resize',()=>size(false));

size(true);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
